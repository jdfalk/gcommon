# file: .github/workflows/ci.yml
# version: 2.0.3
# guid: ci-workflow-gcommon-go
# last-edited: 2026-07-19

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: write
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  ci:
    uses: falkcorp/github-common/.github/workflows/reusable-ci.yml@92800b463b184b62b62e74cfc9568aa6ba55e8ae # main
    with:
      go-version: "1.24"
      skip-protobuf: false # Need protobuf generation for Go SDK (from BSR)
      skip-tests: false
      skip-linting: false
