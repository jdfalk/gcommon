# file: .github/workflows/ci.yml
# version: 2.0.5
# guid: ci-workflow-gcommon-go
# last-edited: 2026-07-19

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: write
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  ci:
    uses: falkcorp/github-common/.github/workflows/reusable-ci.yml@92800b463b184b62b62e74cfc9568aa6ba55e8ae # main
    with:
      go-version: "1.25"
      skip-protobuf: false # Need protobuf generation for Go SDK (from BSR)
      skip-tests: false
      skip-linting: false
      # The reusable workflow's hard go-test coverage gate has no way to
      # exclude generated code (go tool cover -func over the whole module,
      # no path filtering). Since the single-module collapse
      # (docs/AUDIT-2026-07-18-post-org-migration.md Update 2026-07-19),
      # this module's `./...` includes buf-generated *.pb.go for all
      # pkg/*pb/v2 families, which vastly outweighs hand-written code and
      # will only grow with Phase C's 31 additional service families. The
      # 80% default threshold is unreachable for that reason alone, not
      # because the hand-written packages are under-tested (services/auth
      # and services/health individually sit at 75%+/81%+). Disabled here;
      # rely on package-level `go test ./...` coverage output instead.
      coverage-threshold: "0"
