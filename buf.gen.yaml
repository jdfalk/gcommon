# file: buf.gen.yaml
# version: 4.0.0
# guid: buf-gen-managed-mode-gcommon
# last-edited: 2026-07-19

version: v2
inputs:
  - module: buf.build/falkcorp/gcommon
    # v1 is dropped repo-wide (deprecated, no real consumers exist) - only
    # generate v2. See docs/AUDIT-2026-07-18-post-org-migration.md Phase A.
    exclude_paths:
      - authpb/v1
      - commonpb/v1
      - configpb/v1
      - databasepb/v1
      - healthpb/v1
      - mediapb/v1
      - metricspb/v1
      - organizationpb/v1
      - queuepb/v1
      - webpb/v1
managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/googleapis/googleapis
  override:
    # go_package_prefix is the BSR file's own directory (e.g. commonpb/v2)
    # appended to this bare prefix - do NOT repeat the per-module suffix here
    # (that doubles the path, see audit finding #6).
    - file_option: go_package_prefix
      module: buf.build/falkcorp/gcommon
      path: commonpb/v2
      value: github.com/falkcorp/gcommon/v2/pkg
    - file_option: go_package_prefix
      module: buf.build/falkcorp/gcommon
      path: configpb/v2
      value: github.com/falkcorp/gcommon/v2/pkg
    - file_option: go_package_prefix
      module: buf.build/falkcorp/gcommon
      path: databasepb/v2
      value: github.com/falkcorp/gcommon/v2/pkg
    - file_option: go_package_prefix
      module: buf.build/falkcorp/gcommon
      path: healthpb/v2
      value: github.com/falkcorp/gcommon/v2/pkg
    - file_option: go_package_prefix
      module: buf.build/falkcorp/gcommon
      path: mediapb/v2
      value: github.com/falkcorp/gcommon/v2/pkg
    - file_option: go_package_prefix
      module: buf.build/falkcorp/gcommon
      path: metricspb/v2
      value: github.com/falkcorp/gcommon/v2/pkg
    - file_option: go_package_prefix
      module: buf.build/falkcorp/gcommon
      path: organizationpb/v2
      value: github.com/falkcorp/gcommon/v2/pkg
    - file_option: go_package_prefix
      module: buf.build/falkcorp/gcommon
      path: queuepb/v2
      value: github.com/falkcorp/gcommon/v2/pkg
    - file_option: go_package_prefix
      module: buf.build/falkcorp/gcommon
      path: webpb/v2
      value: github.com/falkcorp/gcommon/v2/pkg
    - file_option: go_package_prefix
      module: buf.build/falkcorp/gcommon
      path: authpb/v2
      value: github.com/falkcorp/gcommon/v2/pkg
plugins:
  - local: protoc-gen-go
    out: pkg
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: pkg
    opt: paths=source_relative
